<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IceRimworld — Lore Ad-Lib Editor</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #e0e0e0;
    --muted: #888;
    --input-bg: #1a1a2e;
    --input-border: #333;
    --input-focus: #e94560;
    --current: #534b62;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 1.3rem; color: var(--accent); }
  header .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  button:hover { opacity: 0.85; }
  button.secondary {
    background: var(--surface2);
    border: 1px solid var(--input-border);
  }
  .progress-bar {
    height: 4px;
    background: var(--input-border);
    border-radius: 2px;
    overflow: hidden;
    width: 200px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
  }
  .progress-text { font-size: 0.8rem; color: var(--muted); }
  nav {
    background: var(--surface);
    padding: 8px 24px;
    border-bottom: 1px solid var(--input-border);
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    position: sticky;
    top: 68px;
    z-index: 99;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  nav a:hover, nav a.active { background: var(--surface2); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  section {
    margin-bottom: 40px;
    background: var(--surface);
    border-radius: 8px;
    padding: 20px;
    border: 1px solid var(--input-border);
  }
  section h2 {
    color: var(--accent);
    font-size: 1.1rem;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  section h2 .file-path {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: normal;
    font-family: monospace;
  }
  section > p.desc {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 16px;
  }
  .entry {
    margin-bottom: 16px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 6px;
    border-left: 3px solid var(--surface2);
  }
  .entry.filled { border-left-color: #2ecc71; }
  .entry.removed, .list-entry.removed {
    opacity: 0.35;
    border-left-color: #c0392b;
    position: relative;
  }
  .entry.removed::after, .list-entry.removed::after {
    content: 'REMOVED';
    position: absolute;
    top: 8px;
    right: 12px;
    color: #c0392b;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .entry.removed input, .entry.removed textarea,
  .list-entry.removed input, .list-entry.removed textarea {
    pointer-events: none;
    opacity: 0.4;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .entry-id {
    font-family: monospace;
    font-size: 0.8rem;
    color: var(--accent);
    background: rgba(233,69,96,0.15);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .btn-remove, .btn-restore {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    border: none;
    font-weight: 600;
  }
  .btn-remove {
    background: rgba(192,57,43,0.2);
    color: #e74c3c;
  }
  .btn-remove:hover { background: rgba(192,57,43,0.4); }
  .btn-restore {
    background: rgba(46,204,113,0.2);
    color: #2ecc71;
  }
  .btn-restore:hover { background: rgba(46,204,113,0.4); }
  .entry-meta {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .current-text {
    background: var(--current);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 0.82rem;
    margin-bottom: 8px;
    color: #c0b8d0;
    font-style: italic;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .current-text::before {
    content: 'CURRENT: ';
    color: var(--muted);
    font-style: normal;
    font-weight: 600;
    font-size: 0.7rem;
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--input-border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.9rem;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--input-focus);
    box-shadow: 0 0 0 2px rgba(233,69,96,0.2);
  }
  textarea { min-height: 60px; }
  .list-entry {
    margin-bottom: 12px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 6px;
    border-left: 3px solid var(--surface2);
  }
  .list-entry.filled { border-left-color: #2ecc71; }
  .list-entry label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .list-current {
    background: var(--current);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.8rem;
    color: #c0b8d0;
    margin-bottom: 6px;
    font-style: italic;
    word-break: break-word;
  }
  .list-current::before {
    content: 'CURRENT: ';
    color: var(--muted);
    font-style: normal;
    font-weight: 600;
    font-size: 0.7rem;
  }
  .sub-heading {
    font-size: 0.95rem;
    color: var(--text);
    margin: 20px 0 10px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--input-border);
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #2ecc71;
    color: #fff;
    padding: 12px 20px;
    border-radius: 6px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 700px) {
    main { padding: 12px; }
    section { padding: 12px; }
    header { padding: 10px 12px; }
    nav { padding: 6px 12px; }
  }
</style>
</head>

// =========================================================================
// RENDERING
// =========================================================================

const STORAGE_KEY = 'icerimworld_lore_adlib';
let saved = {};

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch(e) { saved = {}; }
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  updateProgress();
}

function getKey(sectionId, groupIdx, entryId, field) {
  return `${sectionId}|${groupIdx}|${entryId || ''}|${field || ''}`;
}

function getListKey(sectionId, groupIdx, itemIdx) {
  return `${sectionId}|${groupIdx}|list|${itemIdx}`;
}

function getVal(key) { return saved[key] || ''; }
function setVal(key, val) {
  if (val.trim()) saved[key] = val.trim();
  else delete saved[key];
  persist();
}

// Removal tracking
function removeKey(sectionId, groupIdx, entryId) {
  return `__removed|${sectionId}|${groupIdx}|${entryId}`;
}
function removeListKey(sectionId, groupIdx, itemIdx) {
  return `__removed|${sectionId}|${groupIdx}|list|${itemIdx}`;
}
function isRemoved(rKey) { return saved[rKey] === true; }
function markRemoved(rKey) { saved[rKey] = true; persist(); render(); }
function unmarkRemoved(rKey) { delete saved[rKey]; persist(); render(); }

function totalFields() {
  let count = 0;
  for (const sec of SECTIONS) {
    for (let gi = 0; gi < sec.groups.length; gi++) {
      const g = sec.groups[gi];
      if (g.type === 'table') {
        for (const e of g.entries) {
          if (!isRemoved(removeKey(sec.id, gi, e.id))) {
            count += g.fields.length;
          }
        }
      } else if (g.type === 'list') {
        for (let li = 0; li < g.current.length; li++) {
          if (!isRemoved(removeListKey(sec.id, gi, li))) {
            count++;
          }
        }
      }
    }
  }
  return count;
}

function filledFields() {
  let count = 0;
  for (const key in saved) {
    if (key.startsWith('__removed|')) continue;
    if (typeof saved[key] === 'string' && saved[key].trim()) count++;
  }
  return count;
}

function removedCount() {
  let count = 0;
  for (const key in saved) {
    if (key.startsWith('__removed|') && saved[key] === true) count++;
  }
  return count;
}

function updateProgress() {
  const total = totalFields();
  const filled = filledFields();
  const pct = total ? Math.round((filled / total) * 100) : 0;
  const removed = removedCount();
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${filled} / ${total} filled (${pct}%)` + (removed ? ` | ${removed} removed` : '');

  // Update entry styling
  document.querySelectorAll('.entry, .list-entry').forEach(el => {
    const inputs = el.querySelectorAll('input[type="text"], textarea');
    let hasFill = false;
    inputs.forEach(inp => { if (inp.value.trim()) hasFill = true; });
    el.classList.toggle('filled', hasFill);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const main = document.getElementById('main');
  const nav = document.getElementById('navBar');
  let html = '';
  let navHtml = '';

  for (const sec of SECTIONS) {
    navHtml += `<a href="#${sec.id}">${sec.title}</a>`;
    html += `<section id="${sec.id}">`;
    html += `<h2>${escHtml(sec.title)} <span class="file-path">${escHtml(sec.file)}</span></h2>`;

    for (let gi = 0; gi < sec.groups.length; gi++) {
      const g = sec.groups[gi];
      html += `<h3 class="sub-heading">${escHtml(g.heading)}</h3>`;

      if (g.type === 'table') {
        for (const e of g.entries) {
          const rKey = removeKey(sec.id, gi, e.id);
          const removed = isRemoved(rKey);
          html += `<div class="entry${removed ? ' removed' : ''}" data-section="${sec.id}" data-group="${gi}" data-entry="${e.id}">`;
          html += `<div class="entry-header"><span class="entry-id">${escHtml(e.id)}</span>`;
          if (removed) {
            html += `<button class="btn-restore" onclick="unmarkRemoved('${escHtml(rKey)}')">Restore</button>`;
          } else {
            html += `<button class="btn-remove" onclick="markRemoved('${escHtml(rKey)}')">Remove</button>`;
          }
          html += `</div>`;
          for (const f of g.fields) {
            const key = getKey(sec.id, gi, e.id, f);
            const cur = e.current[f] || '';
            const val = getVal(key);
            if (cur) {
              html += `<div class="current-text">${escHtml(cur)}</div>`;
            }
            const isLong = cur.length > 60 || f === 'desc' || f === 'flavor';
            if (isLong) {
              html += `<textarea data-key="${escHtml(key)}" placeholder="Your ${f}...">${escHtml(val)}</textarea>`;
            } else {
              html += `<input type="text" data-key="${escHtml(key)}" placeholder="Your ${f}..." value="${escHtml(val)}">`;
            }
          }
          html += `</div>`;
        }
      } else if (g.type === 'list') {
        for (let li = 0; li < g.current.length; li++) {
          const key = getListKey(sec.id, gi, li);
          const rKey = removeListKey(sec.id, gi, li);
          const removed = isRemoved(rKey);
          const cur = g.current[li];
          const val = getVal(key);
          html += `<div class="list-entry${removed ? ' removed' : ''}" data-section="${sec.id}" data-group="${gi}" data-idx="${li}">`;
          html += `<div class="entry-header"><label>#${li + 1}</label>`;
          if (removed) {
            html += `<button class="btn-restore" onclick="unmarkRemoved('${escHtml(rKey)}')">Restore</button>`;
          } else {
            html += `<button class="btn-remove" onclick="markRemoved('${escHtml(rKey)}')">Remove</button>`;
          }
          html += `</div>`;
          html += `<div class="list-current">${escHtml(cur)}</div>`;
          const isLong = cur.length > 60;
          if (isLong) {
            html += `<textarea data-key="${escHtml(key)}" placeholder="Your replacement...">${escHtml(val)}</textarea>`;
          } else {
            html += `<input type="text" data-key="${escHtml(key)}" placeholder="Your replacement..." value="${escHtml(val)}">`;
          }
          html += `</div>`;
        }
      }
    }
    html += `</section>`;
  }

  main.innerHTML = html;
  nav.innerHTML = navHtml;

  // Bind events
  main.querySelectorAll('input[type="text"], textarea').forEach(el => {
    el.addEventListener('input', () => {
      setVal(el.dataset.key, el.value);
    });
  });

  updateProgress();
}

// =========================================================================
// IMPORT / EXPORT
// =========================================================================

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(saved, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'icerimworld-lore.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON exported!');
}

function loadJSON() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      saved = data;
      persist();
      render();
      showToast('JSON imported! ' + filledFields() + ' fields, ' + removedCount() + ' removed.');
    } catch(err) {
      alert('Invalid JSON file.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function clearAll() {
  if (!confirm('Clear ALL your entries? This cannot be undone.')) return;
  saved = {};
  persist();
  render();
  showToast('All entries cleared.');
}

function exportLua() {
  // Build a structured export that maps section/group/entry/field → new value
  // Organized by file for easy patching
  let output = '-- IceRimworld Lore Patch\n-- Generated from lore-adlib.html\n-- Apply these replacements to the listed files.\n\n';

  for (const sec of SECTIONS) {
    let sectionHasContent = false;
    let sectionOutput = `-- ========== ${sec.file} ==========\n`;

    for (let gi = 0; gi < sec.groups.length; gi++) {
      const g = sec.groups[gi];
      let groupHasContent = false;
      let groupOutput = `-- ${g.heading}\n`;

      if (g.type === 'table') {
        for (const e of g.entries) {
          const rKey = removeKey(sec.id, gi, e.id);
          if (isRemoved(rKey)) {
            groupOutput += `-- [${e.id}]: REMOVE ENTIRE ENTRY\n`;
            groupHasContent = true;
            continue;
          }
          for (const f of g.fields) {
            const key = getKey(sec.id, gi, e.id, f);
            const val = getVal(key);
            if (val) {
              groupOutput += `-- [${e.id}].${f}: "${val.replace(/"/g, '\\"')}"\n`;
              groupHasContent = true;
            }
          }
        }
      } else if (g.type === 'list') {
        for (let li = 0; li < g.current.length; li++) {
          const rKey = removeListKey(sec.id, gi, li);
          if (isRemoved(rKey)) {
            groupOutput += `-- [${li + 1}]: REMOVE — was "${g.current[li].replace(/"/g, '\\"')}"\n`;
            groupHasContent = true;
            continue;
          }
          const key = getListKey(sec.id, gi, li);
          const val = getVal(key);
          if (val) {
            groupOutput += `-- [${li + 1}]: "${val.replace(/"/g, '\\"')}"\n`;
            groupHasContent = true;
          }
        }
      }

      if (groupHasContent) {
        sectionOutput += groupOutput + '\n';
        sectionHasContent = true;
      }
    }

    if (sectionHasContent) {
      output += sectionOutput + '\n';
    }
  }

  if (filledFields() === 0 && removedCount() === 0) {
    alert('No entries filled in or removed yet.');
    return;
  }

  const blob = new Blob([output], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'icerimworld-lore-patch.lua';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Lua patch file exported!');
}

loadSaved();

document.getElementById('navBar').addEventListener('click', (e) => {
  if (e.target.tagName === 'A') {
    e.preventDefault();
    const id = e.target.getAttribute('href').slice(1);
    document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});
